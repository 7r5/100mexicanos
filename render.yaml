services:
  - type: web
    name: mexicanos-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    region: oregon
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mexicanos-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: HOST_TOKEN
        value: change-this-host-token
      - key: FRONTEND_URL
        value: "*"

  - type: web
    name: mexicanos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: mexicanos-backend
          property: host
      - key: VITE_HOST_TOKEN
        value: change-this-host-token

databases:
  - name: mexicanos-db
    plan: free
    region: oregon
    databaseName: mexicanos
    user: mexicanos
    ipAllowList: []
